version: "3.8"

services:
  db:
    image: postgres:latest
    container_name: score-platform-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: score_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: score-platform-api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/score_db?schema=public
      - JWT_SECRET=antigravity_secret_key_12345
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: score-platform-web
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
